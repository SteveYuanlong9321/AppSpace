<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <meta name="description" content="AppSpace · 应用空间：搜索多个 Android 应用来源、查看应用详情并选择下载渠道。">
  <meta name="site-build" content="2026-10-21-03">
  <title>AppSpace · 应用空间</title>
  <link rel="icon" type="image/webp" href="./assets/appspace-icon.webp?v=1.0.3">
  <link rel="stylesheet" href="./style.css?v=1.0.1">
</head>
<body>
  <main class="site">
    <header class="site-header">
      <a class="brand" href="./" aria-label="AppSpace 首页">AppSpace</a>
      <div class="header-actions">
        <a class="author-button" href="https://steve0309.dpdns.org/">Steve 的小站</a>
        <span class="version">1.0</span>
      </div>
    </header>

    <section class="hero">
      <div class="hero-aura" aria-hidden="true"></div>

      <div class="app-icon-wrap">
        <img class="app-icon" src="./assets/appspace-icon.webp?v=1.0.3" alt="AppSpace 应用图标">
      </div>

      <div class="eyebrow">APPSPACE FOR ANDROID</div>

      <h1>发现应用，<span>不止一个来源</span></h1>

      <p class="intro">
        一个搜索入口，多种 Android 应用来源。搜索应用、查看应用信息，并为同一个应用选择适合自己的下载渠道。
      </p>

      <div class="download-links">
        <a class="release-link" href="https://github.com/SteveYuanlong9321/AppSpace/releases" target="_blank" rel="noopener noreferrer" aria-label="Download on GitHub Releases">
          <img class="release-badge" src="./assets/github-releases-badge.png?v=1.0.3" alt="Download on GitHub Releases">
        </a>

        <a class="release-link" href="https://steve0309.dpdns.org/fdroid/repo" target="_blank" rel="noopener noreferrer" aria-label="Get it from Steve’s F-Droid repository">
          <img class="release-badge" src="./assets/fdroid-badge.png?v=1.0.3" alt="Get it on F-Droid">
        </a>

        <a class="release-link" href="https://github.com/SteveYuanlong9321/AppSpace" target="_blank" rel="noopener noreferrer" aria-label="Browse AppSpace source code">
          <img class="release-badge" src="./assets/github-source-badge.svg?v=1.0.3" alt="Browse AppSpace source code">
        </a>
      </div>

      <div class="download-links download-links-cn" aria-label="更多项目入口">
        <a class="release-link" href="https://github.com/SteveYuanlong9321/AppSpace/issues" target="_blank" rel="noopener noreferrer" aria-label="Report an issue">
          <img class="release-badge" src="./assets/issues-badge.svg?v=1.0.3" alt="Report an issue on GitHub">
        </a>

        <a class="release-link" href="https://steve0309.dpdns.org/" target="_blank" rel="noopener noreferrer" aria-label="Visit Steve's website">
          <img class="release-badge" src="./assets/steve-site-badge.svg?v=1.0.3" alt="Visit Steve's website">
        </a>
      </div>

      <div class="hero-meta">
        <span>Android</span>
        <span class="meta-dot"></span>
        <span>Version 1.0</span>
        <span class="meta-dot"></span>
        <a href="https://github.com/SteveYuanlong9321/AppSpace" target="_blank" rel="noopener noreferrer">Open Source</a>
      </div>
    </section>

    <footer class="site-footer">
      <span>AppSpace · 应用空间</span>
      <div class="site-footer-links">
        <a href="https://github.com/SteveYuanlong9321/AppSpace/issues" target="_blank" rel="noopener noreferrer">Feedback / Issues</a>
        <a href="https://github.com/SteveYuanlong9321/AppSpace" target="_blank" rel="noopener noreferrer">Source Code</a>
      </div>
    </footer>
  </main>
</body>
</html>
